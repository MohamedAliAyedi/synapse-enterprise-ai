version: '3.8'
services:
  gateway:
    image: synapse/api-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      - discovery
  discovery:
    image: synapse/discovery-server:latest
    ports:
      - "8761:8761"
  ai-orchestrator:
    image: synapse/ai-orchestrator-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8081:8080"
    depends_on:
      - discovery
  document-indexer:
    image: synapse/document-indexer-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8082:8080"
    depends_on:
      - discovery
  notification:
    image: synapse/notification-service:latest
    ports:
      - "8083:8080"
    depends_on:
      - discovery
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: