name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_db
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U synapse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend services
        run: |
          ./mvnw -B verify -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Start Angular dev server
        working-directory: ./frontend
        run: |
          npm run start &
          SERVER_PID=$!
          echo "Angular server PID: $SERVER_PID" > server.pid
          # Wait until the server is responding
          n=0
          until curl -s http://localhost:4200 || [ $n -ge 30 ]; do
            echo "Waiting for Angular dev server... ($n)"
            sleep 2
            n=$((n+1))
          done
        env:
          CI: true

      - name: Run Cypress end-to-end tests
        working-directory: ./frontend
        run: npx cypress run --config baseUrl=http://localhost:4200
        env:
          CI: true

      - name: Stop Angular dev server
        if: always()
        run: |
          if [ -f frontend/server.pid ]; then
            kill $(cat frontend/server.pid) || true
          fi