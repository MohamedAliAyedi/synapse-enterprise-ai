name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend services
        run: ./mvnw -B verify

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start dependent Docker services
        run: ./.github/scripts/start-services.sh
        env:
          COMPOSE_PROJECT_NAME: synapse-enterprise-ai

      - name: Run Cypress end-to-end tests
        uses: cypress-io/github-action@v5
        with:
          working-directory: frontend
          start: npm run start
          wait-on: http://localhost:4200
          wait-on-timeout: 120
          browser: chrome
