version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: synapse-postgres
    environment:
      POSTGRES_DB: synapse_db
      POSTGRES_USER: synapse_user
      POSTGRES_PASSWORD: synapse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.5
    container_name: synapse-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 15s
      timeout: 10s
      retries: 6

  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: synapse-zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "srvr", "|", "nc", "localhost", "2181"]
      interval: 15s
      timeout: 10s
      retries: 6

  discovery-server:
    build:
      context: ./services/discovery-server
    container_name: synapse-discovery
    ports:
      - "8761:8761"
    environment:
      - "SPRING_PROFILES_ACTIVE=container"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 6

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: synapse-gateway
    ports:
      - "8080:8080"
    environment:
      - "SPRING_PROFILES_ACTIVE=container"
    depends_on:
      - discovery-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 6

  ai-orchestrator-service:
    build:
      context: ./services/ai-orchestrator-service
    container_name: synapse-ai-orchestrator
    environment:
      - "SPRING_PROFILES_ACTIVE=container"
    depends_on:
      - discovery-server
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 6

  document-indexer-service:
    build:
      context: ./services/document-indexer-service
    container_name: synapse-doc-indexer
    environment:
      - "SPRING_PROFILES_ACTIVE=container"
    depends_on:
      - discovery-server
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 6

  notification-service:
    build:
      context: ./services/notification-service
    container_name: synapse-notifications
    environment:
      - "SPRING_PROFILES_ACTIVE=container"
    depends_on:
      - discovery-server
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 6

volumes:
  postgres_data:
